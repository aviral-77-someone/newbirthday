<html lang="en">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0a2e 0%, #3a0a4e 50%, #5a0a66 100%);
            z-index: -2;
        }

        #starCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        #petalsCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .birthday-text {
            font-family: 'Dancing Script', cursive;
            color: white;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            white-space: nowrap;
            font-size: 100px;
        }

        .romantic-message {
            font-family: 'Poppins', sans-serif;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            font-weight: 300;
            font-size: 1.2rem;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 20, 147, 0.5);
            width: 80%;
            max-width: 600px;
        }

        .hearts-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .heart {
            position: absolute;
            width: 30px;
            height: 30px;
            opacity: 0;
            transform: scale(0);
        }

        .birthday-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        .celebrate-button {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%) scale(0);
            padding: 15px 40px
            border-radius: 50px;
            background: linear-gradient(45deg, #ff3e8d, #ff2d69);
            color: white;
            font-weight: 500;
            letter-spacing: 2px;
            border: none;
            cursor: pointer;
            font-size: 18px;
            opacity: 0;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            box-shadow: 0 5px 15px rgba(255, 45, 105, 0.5),
                        0 0 30px rgba(255, 45, 105, 0.3),
                        inset 0 0 10px rgba(255, 255, 255, 0.3);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .celebrate-button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.4) 0%, transparent 70%);
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.4s ease;
        }

        .celebrate-button:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 7px 25px rgba(255, 45, 105, 0.7),
                        0 0 40px rgba(255, 45, 105, 0.5),
                        inset 0 0 15px rgba(255, 255, 255, 0.4);
        }

        .celebrate-button:hover::before {
            opacity: 1;
            transform: scale(1);
        }

        .celebrate-button:active {
            transform: translateX(-50%) scale(0.98);
        }

        .letter {
            display: inline-block;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .glow-effect {
            animation: pulse 2s infinite ease-in-out;
        }

        @media screen and (max-width: 768px) {
            .birthday-text {
                font-size: 3.5rem;
                width: 100%;
                padding: 0 20px;
            }
            
            .romantic-message {
                font-size: 1rem;
                top: 65%;
            }
            
            .celebrate-button {
                bottom: 15%;
                padding: 12px 30px;
                font-size: 16px;
            }
        }

        @media screen and (max-width: 480px) {
            .birthday-text {
                font-size: 2.5rem;
            }
            
            .romantic-message {
                font-size: 0.9rem;
                width: 90%;
            }
            
            .celebrate-button {
                bottom: 10%;
                padding: 10px 25px;
                font-size: 14px;
            }
        }
        .next-page-button {
            position: fixed;
            bottom: 10px;
            right: 10px;
            padding: 10px 20px;
            border-radius: 5px;
            background: linear-gradient(45deg, #ff3e8d, #ff2d69);
            color: rgb(91, 69, 219);
            font-weight: 500;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            opacity: 0;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            box-shadow: 0 5px 15px rgba(255, 45, 45, 0.5),
                        0 0 30px rgba(255, 45, 105, 0.3),
                        inset 0 0 10px rgba(255, 255, 255, 0.3);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .next-page-button:hover {
            transform: scale(1.05);
            box-shadow: 0 7px 25px rgba(255, 45, 105, 0.7),
                        0 0 40px rgba(255, 45, 105, 0.5),
                        inset 0 0 15px rgba(172, 154, 154, 0.4);
        }
    
        .next-page-button:active {
            transform: scale(0.98);
        }

    </style>
</head>

    <div class="background"></div>
    <canvas id="starCanvas"></canvas>
    <canvas id="petalsCanvas"></canvas>
    <canvas id="fireworksCanvas"></canvas>
    <div class="hearts-container" id="heartsContainer"></div>
    
    <div class="birthday-container">
        <h1 class="birthday-text text-6xl">Happiest Birthday, Shivani</h1>
        <p class="romantic-message">Every moment with you is a celebration, but today is especially magical. Here's to another year of love, laughter, and countless beautiful memories together.</p>
        <button class="celebrate-button" id="celebrateBtn">Celebrate Our Love</button>
        <button class="next-page-button" id="nextPageBtn">Next</button>

    <script>
        // Canvas elements
        const starCanvas = document.getElementById('starCanvas');
        const starCtx = starCanvas.getContext('2d');
        const fireworksCanvas = document.getElementById('fireworksCanvas');
        const fireworksCtx = fireworksCanvas.getContext('2d');
        const petalsCanvas = document.getElementById('petalsCanvas');
        const petalsCtx = petalsCanvas.getContext('2d');
        const heartsContainer = document.getElementById('heartsContainer');

        // Set canvas size
        function resizeCanvas() {
            starCanvas.width = window.innerWidth;
            starCanvas.height = window.innerHeight;
            fireworksCanvas.width = window.innerWidth;
            fireworksCanvas.height = window.innerHeight;
            petalsCanvas.width = window.innerWidth;
            petalsCanvas.height = window.innerHeight;
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Star class for twinkling stars
        class Star {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * starCanvas.width;
                this.y = Math.random() * starCanvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.maxSize = this.size + Math.random() * 2;
                this.opacity = Math.random() * 0.5 + 0.3;
                this.glowFactor = Math.random() * 15 + 5;
                this.speed = Math.random() * 0.05 + 0.01;
                this.growing = Math.random() > 0.5;
                this.color = {
                    r: 255,
                    g: Math.floor(Math.random() * 100) + 155,
                    b: Math.floor(Math.random() * 155) + 100
                };
            }
            
            update() {
                if (this.growing) {
                    this.size += this.speed;
                    if (this.size >= this.maxSize) {
                        this.growing = false;
                    }
                } else {
                    this.size -= this.speed;
                    if (this.size <= 0.5) {
                        this.growing = true;
                    }
                }
                
                // Twinkle effect with color change
                if (Math.random() < 0.01) {
                    this.color.g = Math.floor(Math.random() * 100) + 155;
                    this.color.b = Math.floor(Math.random() * 155) + 100;
                }
                
                // Occasionally reset for more dynamic movement
                if (Math.random() < 0.001) {
                    this.reset();
                }
            }
            
            draw() {
                const glow = starCtx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.size * this.glowFactor
                );
                
                glow.addColorStop(0, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.opacity})`);
                glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
                
                starCtx.fillStyle = glow;
                starCtx.beginPath();
                starCtx.arc(this.x, this.y, this.size * this.glowFactor, 0, Math.PI * 2);
                starCtx.fill();
                
                starCtx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.opacity})`;
                starCtx.beginPath();
                starCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                starCtx.fill();
            }
        }

        // Petal class for falling rose petals
        class Petal {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * petalsCanvas.width;
                this.y = -20;
                this.size = Math.random() * 15 + 8;
                this.speedY = Math.random() * 1 + 0.5;
                this.speedX = Math.random() * 2 - 1;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 2 - 1;
                this.opacity = Math.random() * 0.5 + 0.5;
                this.color = {
                    r: Math.floor(Math.random() * 55) + 200,
                    g: Math.floor(Math.random() * 50),
                    b: Math.floor(Math.random() * 80) + 50
                };
            }
            
            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y * 0.01) + this.speedX;
                this.rotation += this.rotationSpeed;
                
                if (this.y > petalsCanvas.height) {
                    this.reset();
                }
            }
            
            draw() {
                petalsCtx.save();
                petalsCtx.translate(this.x, this.y);
                petalsCtx.rotate(this.rotation * Math.PI / 180);
                
                // Draw petal shape
                petalsCtx.beginPath();
                petalsCtx.moveTo(0, 0);
                petalsCtx.bezierCurveTo(
                    this.size / 2, -this.size / 4,
                    this.size, -this.size / 2,
                    0, -this.size
                );
                petalsCtx.bezierCurveTo(
                    -this.size, -this.size / 2,
                    -this.size / 2, -this.size / 4,
                    0, 0
                );
                
                // Fill with gradient
                const gradient = petalsCtx.createLinearGradient(0, 0, 0, -this.size);
                gradient.addColorStop(0, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.opacity})`);
                gradient.addColorStop(1, `rgba(${this.color.r - 30}, ${this.color.g}, ${this.color.b + 20}, ${this.opacity * 0.7})`);
                petalsCtx.fillStyle = gradient;
                petalsCtx.fill();
                
                petalsCtx.restore();
            }
        }

        // Firework particle class
        class FireworkParticle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 3 + 1;
                this.velocity = {
                    x: (Math.random() - 0.5) * 8,
                    y: (Math.random() - 0.5) * 8
                };
                this.gravity = 0.04;
                this.friction = 0.97;
                this.opacity = 1;
                this.life = Math.random() * 60 + 80;
                this.remainingLife = this.life;
            }
            
            update() {
                this.velocity.y += this.gravity;
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;
                
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                
                this.remainingLife--;
                this.opacity = this.remainingLife / this.life;
            }
            
            draw() {
                fireworksCtx.beginPath();
                fireworksCtx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                fireworksCtx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.opacity})`;
                fireworksCtx.fill();
                
                // Add glow effect
                const glow = fireworksCtx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.radius * 4
                );
                
                glow.addColorStop(0, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.opacity * 0.7})`);
                glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                
                fireworksCtx.fillStyle = glow;
                fireworksCtx.beginPath();
                fireworksCtx.arc(this.x, this.y, this.radius * 4, 0, Math.PI * 2);
                fireworksCtx.fill();
            }
        }

        // Heart-shaped firework
        class HeartFirework {

                    x: (this.destination.x - this.x) / 100,

                };
                this.trail = [];
                this.exploded = false;
            }
            
            update() {
                if (!this.exploded) {
                    this.x += this.velocity.x;

                    // Add trail
                    this.trail.push({

                        y: this.y,
                        opacity: 1
                    });
                    
                    // Update trail
                    for (let i = 0; i < this.trail.length; i++) {
                        this.trail[i].opacity -= 0.025;
                        if (this.trail[i].opacity <= 0) {
                            this.trail.splice(i, 1);
                            i--;
                        }
                    }
                    
                    // Check if arrived at destination
                    const distance = Math.sqrt(
                        Math.pow(this.x - this.destination.x, 2) +

                    if (distance < 10 || this.y <= this.destination.y) {

                            i--;
                        }
                    }
                }
            }
            
            explode() {

                    heartPoints.push({
                        x: heartX * 3, // Scale factor
                        y: heartY * 3  // Scale factor
                    });
                }
                
                // Create particles at heart points
                for (let i = 0; i < heartPoints.length; i++) {
                    const particle = new FireworkParticle(this.x, this.y, this.color);
                    particle.velocity.x = heartPoints[i].x * (Math.random() * 0.1 + 0.05);
                    particle.velocity.y = heartPoints[i].y * (Math.random() * 0.1 + 0.05);
                    this.particles.push(particle);
                }
            }
